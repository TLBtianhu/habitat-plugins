name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node tools/verify-plugin-index.mjs
      - run: node tools/build-plugin-packages.mjs
      - run: node tools/verify-plugin-index.mjs
      - run: node tools/verify-app-loading.mjs
